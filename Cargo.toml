[package]
name = "crow"
version = "0.5.2"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10"
html-escape = "0.2.13"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
tokio-rusqlite = "0.7.0"
toml = "1.1"
regex = "1.12"
url = "2.5"
lazy_static = "1.5"
mysql = "28.0.0"
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.27.0"
urlencoding = "2.1.3"
base64 = "0.22"

[profile.release]
panic = "abort"
